<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سراج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&family=Noto+Nastaliq+Urdu:wght@500;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light only;--bg:#f7f1e1;--bg2:#e8efdb;--card:rgba(255,252,243,.9);--ink:#4a4a3a;--soft:#767662;--rose:#b9cfae;--rose2:#5f8458;--lilac:#dce7cf;--sage:#a9c09b;--sage2:#6f8f63;--gold:#c2a15f;--line:rgba(160,150,90,.4);--sh:0 8px 22px rgba(90,100,60,.13);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg),var(--bg2));line-height:1.9;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
.ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;background:radial-gradient(circle at 20% 15%,#dfe9cf 0,transparent 45%),radial-gradient(circle at 85% 85%,#f1e6c4 0,transparent 45%),#f8f3e4;color:#4a4a3a;transition:opacity .8s,transform .8s}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.dua{font-family:"Noto Naskh Arabic",Vazirmatn,serif;font-size:19px;line-height:2.2;max-width:320px;color:#5a5a46;margin:0 0 26px}.dua b{color:#4f7248;font-weight:700}
.orn{color:var(--gold);letter-spacing:8px}
.logo{font-family:"Noto Nastaliq Urdu",serif;font-size:clamp(52px,16vw,80px);font-weight:700;color:#5f8458;margin:22px 0 30px;padding:.2em 0;line-height:2.2}
.sub{font-size:15px;margin:0}
.cta{background:linear-gradient(135deg,#7f9a73,#5f8458);color:#fff;padding:14px 38px;border-radius:30px;font-weight:600;font-size:17px;box-shadow:0 8px 20px rgba(95,132,88,.4);min-height:48px}
.cta:active{transform:scale(.96)}
#app{max-width:760px;margin:0 auto;padding:16px 16px 40px;display:none}
#app.on{display:block;animation:fade .7s}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero h1{font-size:28px;margin:6px 0 0;color:var(--rose2);font-weight:800}
.hero p{margin:2px 0 12px;color:var(--soft);font-size:14px}
.prog{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--sh)}
.bar{height:10px;border-radius:9px;background:rgba(169,184,160,.35);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sage),var(--rose));border-radius:9px;transition:width .6s}
.srch{width:100%;margin:14px 0;padding:12px 16px;border-radius:24px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;text-align:right;background:var(--card);border-radius:20px 20px 20px 6px;padding:16px 12px 12px;box-shadow:var(--sh);border:1px solid var(--line);min-height:150px;transition:transform .25s}
.tile:hover,.tile:active{transform:translateY(-3px) rotate(-.6deg)}
.tile::before{content:"";position:absolute;top:-6px;right:50%;width:46px;height:14px;margin-right:-23px;background:var(--c);opacity:.7;transform:rotate(-3deg);border-radius:2px}
.tile .ib{width:44px;height:44px;border-radius:14px;background:var(--c);display:grid;place-items:center;color:#4a5a40;margin-bottom:6px}
.tile b{display:block;font-size:15px;line-height:1.5}
.tile small{color:var(--soft);font-size:12px;line-height:1.6;display:block}
.tile .st{position:absolute;left:10px;top:10px;font-size:11px;color:var(--sage2);font-weight:600}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--rose2);font-weight:600;padding:10px 4px;min-height:44px}
.pg h2{font-size:25px;margin:0;color:var(--rose2)}
.pg .lead{color:var(--soft);font-size:14px;margin:2px 0 14px}
.paper{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:var(--sh)}
.paper h3{margin:0 0 4px;font-size:16px}
.paper p{margin:4px 0;font-size:14px}
.ds{display:block;color:var(--soft);font-size:12px;line-height:1.7;font-weight:400}.paper.lk{display:block;text-decoration:none;color:inherit}.paper p{white-space:pre-line}.mapbox{overflow:auto;border-radius:14px;max-height:80vh}.mapbox img{width:100%;display:block;margin:0!important;border-radius:0!important}.mapbox.z img{width:220%}.hit{display:block;width:100%;text-align:right;margin:10px 0}.ph{color:var(--soft);font-size:13px;border-bottom:1px dashed var(--line);padding:2px 0}
.img{height:90px;border-radius:12px;background:repeating-linear-gradient(45deg,var(--lilac) 0 10px,#eef3e4 10px 20px);display:grid;place-items:center;color:#8a746b;font-size:12px;margin-bottom:8px}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0;box-shadow:var(--sh);overflow:hidden}
summary{padding:14px;font-weight:600;cursor:pointer;list-style:none;min-height:48px;display:flex;justify-content:space-between}
summary::after{content:"＋";color:var(--gold)}details[open] summary::after{content:"－"}
details>div{padding:0 14px 14px}
.chk{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px dotted var(--line);cursor:pointer;min-height:48px;font-size:15px}
.chk input{width:22px;height:22px;accent-color:var(--rose2);flex:none}
.chk input:checked+span{text-decoration:line-through;color:var(--soft)}
.tag{font-size:10px;padding:1px 8px;border-radius:9px;background:var(--rose);color:#fff;margin-right:6px}
.tag.s{background:var(--sage2)}
.pct{font-weight:800;color:var(--rose2)}
.msg{background:linear-gradient(135deg,#dce7cf,#f5ecd0);color:#4a4a3a;border-radius:16px;padding:14px;margin:14px 0;text-align:center;font-size:14px}
.btn{display:inline-block;padding:10px 22px;border-radius:22px;background:var(--sage2);color:#fff;text-decoration:none;font-size:14px;min-height:44px;margin-top:6px}
.btn.off{background:rgba(138,116,107,.35);pointer-events:none}
.btn.g{background:none;border:1px solid var(--rose2);color:var(--rose2)}
.foot{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:none;justify-content:space-around;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.on{display:flex}
nav button{display:flex;flex-direction:column;align-items:center;font-size:11px;padding:4px 14px;min-height:48px;color:var(--soft)}
nav button.a{color:var(--rose2);font-weight:600}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#5a4545;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:60;opacity:0;transition:opacity .4s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section id="splash">
 <div class="orn">❀ ✦ ❀</div>
 <p class="dua">به نام او که <b>چراغ دانایی</b> را در دل‌ها روشن کرد و <b>رسالت آموختن</b> را به انسان سپرد.</p>
 <h1 class="logo">سراج</h1>
 <p class="sub">راهنمای خوش‌آمدگویی دانشجومعلمان جدیدالورود</p>
 <button class="cta" id="go">شروع ماجرا ✨</button>
</section>
<main id="app"></main>
<div class="toast" id="toast"></div>

 blocks:[["","سلام به تو که امروز، با هزار امید و انگیزه، نخستین گام را در خانهٔ معلمی برداشته‌ای.\n\nاین سطرها، سلامِ یکی از هم‌مسیرانِ دیروزِ همین دانشگاه است؛ محمدمهدی فدایی، دانشجومعلمِ آموزش ریاضی که روزگاری مثل تو، با شوقِ آموختن قدم به این کلاس‌ها گذاشت.\n\nمن پیش از این، دانشجوی مهندسی مکانیک دانشگاه صنعتی بودم؛ اما وقتی شکوهِ «انسان‌سازی» و امتدادِ رسالتِ انبیا را در معلمی دیدم، از دنیای فرمول‌ها دل کندم و عاشقانه راهی دانشگاه فرهنگیان شدم. معلمی یعنی با حوصله و مهربانی، دستِ دیگری را برای رشد و یادگیری گرفتن؛ و تمرینِ این هنرِ زیبا، از همین روزهای دانشجویی آغاز می‌شود.\n\nحالا که در دی‌ماه ۱۴۰۴، تقدیر من را از کلاسِ کوچکِ دانشگاه به کلاسی به وسعتِ تمامِ ایران برده است، گچِ سپیدِ این تخته و آیندهٔ روشنِ این سرزمین را به دست‌های توانمندِ تو می‌سپارم.\n\nبا لبخند و «توکل بر خدا» قدم بردار؛ مطمئن باش در این مسیرِ پرافتخار تنها نیستی و زیباترین فصلِ زندگی‌ات از همین امروز آغاز شده است.\n\nبه دانشگاه فرهنگیان خوش آمدی، معلمِ آینده!"]]},

{id:"s4",t:"اولین قرار ما",d:"یک مأموریت تازه در راه است",ic:"cal",c:"#f5ecd0",type:"text",lead:"آماده‌ای؟",
 blocks:[["","🚩 یه مأموریت تازه در راهه؛ آماده‌ای؟\n\nقراره اولین قرارمون رو تجربه کنیم؛ قراری برای آشنایی با آدم‌هایی که قراره هم‌مسیرمون باشن، کشف دنیایی که تازه واردش شدیم و پیدا کردن نقشه راهی که پیش رومونه!\n\nاما یه سؤال مهم...\n\nتو می‌دونی قراره چه معلمی باشی؟ چه جایگاهی در انتظارته و برای رسیدن به قله معلمی باید از چه مسیری عبور کنی؟ 🏔️\n\nاینجا نقطه شروع ماجراست!\n\nسراج ۱۴۰۵؛ اولین قرار، برای شناختن قله، کشف مسیر و پیدا کردن هم‌تیمی‌ها!\n\nپس حواست باشه؛ این قرار رو نباید از دست بدی! 😉\n\nتا فتح قله باهم، هم‌عهد و هم‌مسیریم."]]},

 ["پوشاک و لوازم شخصی",["پوشاک روزمره::لباس بیرونی و لباس خونگی برای محیط خوابگاه (حداقل دو دست).","لوازم عبادی::چادر رنگی و مهر و جانماز (و قرآن کوچک).","دمپایی::برای سلف، حمام و ... (حداقل ۲ جفت).","چوب‌لباسی (۴ تا ۵ عدد)::فضای کمدهای خوابگاه محدوده و چوب‌لباسی کمک می‌کنه مانتو و لباس‌ها چروک نشن و نظم بیشتری داشته باشن.","کیسه لباس چرک::یک کیسه پارچه‌ای یا نایلون ضخیم تا لباس‌های استفاده‌شده با لباس‌های تمیز داخل کمد قاطی نشن.","قفل کوچک آویز و جاکلیدی متمایز::برای قفل کردن کمد شخصی و پیدا کردن راحت‌تر کلید اتاق بین کلیدهای بقیه بچه‌ها.","خرت‌وپرت‌های ضروری::نخ و سوزن (خیلی واجبه)، ناخن‌گیر، قیچی کوچک و سنجاق‌قفلی."]],
 ["ظروف و لوازم آشپزخانه",["ظروف شخصی::دو عدد بشقاب، قاشق و چنگال، چاقو، پیاله، لیوان و فلاسک.","قابلمه و ماهیتابه کوچک::حتی اگر اهل آشپزی مفصل نیستین، برای گرم کردن غذای سلف یا درست کردن نیمرو و املت خیلی به کارتون میاد.","ظروف دردار مخصوص یخچال (۲ تا ۳ عدد در سایزهای مختلف)::برای نگهداری باقی‌مانده غذای سلف، پنیر، میوه یا خوراکی‌ها در یخچال مشترک؛ هم جلوی بو گرفتن و ریختن غذا رو می‌گیره و هم فضای کمتری اشغال می‌کنه.","بسته‌بندی::پلاستیک فریزر."]],
 ["مواد غذایی و خوراکی",["مواد غذایی خشک::مثل چای، قند، نبات و مغزیجات.","خوراکی‌های یخچالی::هر چیزی که دوست دارین با در نظر گرفتن فضای کم یخچال و فریزر و تعداد بالای افراد اتاق :)"]],
 ["بهداشت، حمام و نظافت",["وسایل حمام و شست‌وشوی لباس::وسایل بهداشتی، حوله، تشت، گیره و آویز لباس + مایع لباس‌شویی.","لوازم بهداشتی و آرایشی::وسایل آرایشی و بهداشتی شخصی به همراه دستمال کاغذی.","شست‌وشوی ظروف::اسکاچ، مایع ظرف‌شویی کوچک و دستمال خشک‌کن (برای شستن و خشک کردن سریع ظرف‌ها قبل از گذاشتن توی کمد).","نظافت اتاق::دستمال مرطوب، دستمال گردگیری و کیسه زباله کوچک برای تمیز کردن سریع میز، قفسه کمد و سطل زباله."]],

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2200)}
const items=s=>s.groups.flatMap((g,gi)=>g[1].map((x,i)=>({id:s.key+gi+"_"+i,x})));
const pct=s=>{const a=items(s);return Math.round(a.filter(o=>S.ck[o.id]).length/a.length*100)};

/* ===== نمایش ===== */
function home(q=""){
 const n=Object.keys(S.visited).length, pr=Math.round(n/SECTIONS.length*100);
 const list=SECTIONS.filter(s=>(s.t+s.d).includes(q));
 return `<div class="hero"><div class="orn" style="font-size:12px">❀ سراج ❀</div><h1>به دانشگاهت خوش اومدی!</h1><p>این میز راهنمای توست؛ هر بخش را هر وقت دوست داشتی باز کن.</p></div>
 <div class="prog"><div style="display:flex;justify-content:space-between;font-size:13px"><span>آشنایی با دانشگاه</span><span class="pct">${pr}٪</span></div><div class="bar"><i style="width:${pr}%"></i></div></div>
 <input class="srch" id="q" type="search" placeholder="جست‌وجو در همه‌ی کلمات دفترچه..." value="${esc(q)}">
 <div class="grid" id="grid">${list.map(tile).join("")||'<p class="ph">بخشی پیدا نشد. عبارت دیگری را امتحان کن.</p>'}</div>`;
}
function tile(s){
 const st=s.type==="check"?pct(s)+"٪":(S.visited[s.id]?"✓ دیده شد":"");
 return `<button class="tile" style="--c:${s.c}" onclick="location.hash='${s.id}'"><span class="st">${st}</span><div class="ib">${svg(s.ic)}</div><b>${s.t}</b><small>${s.d}</small></button>`;
}
const fig=(s,a)=>s?`<img src="${esc(s)}" alt="${a}" style="width:100%;border-radius:14px;margin:8px 0">`:`<div class="img" style="height:150px">${a}؛ جای تصویر</div>`;
function rows(r){return r.map(a=>`<div class="ph">${a[0]}: ${esc(a[1])}</div>`).join("")}
function body(s){
 if(s.type==="text")return s.blocks.map(b=>`<div class="paper">${b[0]?`<h3>${b[0]}</h3>`:""}<p>${esc(b[1])}</p></div>`).join("")+(s.img!==undefined?fig(s.img,"عکس ۱"):"");
 if(s.type==="acc")return s.items.map(o=>`<details><summary>${o.t}</summary><div>${o.img?'<div class="img">جای تصویر</div>':""}${rows(o.rows)}${o.map!==undefined?'<div class="ph">نقشه: [لینک نقشه]</div>':""}</div></details>`).join("");
 if(s.type==="campus")return s.drawers.map(o=>`<details><summary>${o.t}</summary><div>${o.g.map(g=>`<h3 style="margin:10px 0 2px;font-size:15px;color:var(--rose2)">${g[0]}</h3>${g[1].map(l=>`<div class="ph">${l}</div>`).join("")}`).join("")}</div></details>`).join("")+`<h3 style="margin:18px 0 0">نقشه راهنمای دانشگاه</h3><div class="mapbox" onclick="this.classList.toggle('z')">${fig(s.map,"نقشه دانشگاه")}</div><p class="ph">برای بزرگ‌نمایی روی نقشه بزن</p><div class="paper"><h3>راهنمای نقشه</h3>${s.legend.map((l,i)=>`<div class="ph">${i+1}. ${l}</div>`).join("")}</div>`;
 if(s.type==="events")return s.items.map(o=>`<div class="paper"><div class="img">جای تصویر</div><h3>${o.t}</h3>${rows([["تاریخ",o.date||"تاریخ"],["ساعت",o.time||"ساعت"],["مکان",o.place||"مکان"]])}${o.link?`<a class="btn" href="${esc(o.link)}" target="_blank" rel="noopener">ثبت‌نام / جزئیات</a>`:'<span class="btn off">به‌زودی</span>'}</div>`).join("");
 if(s.type==="links")return s.items.map(o=>o.link?`<a class="paper lk" href="${esc(o.link)}" target="_blank" rel="noopener"><h3>${o.t}</h3><p>${o.d}</p><span class="btn">ورود به کانال</span></a>`:`<div class="paper"><h3>${o.t}</h3><p>${o.d}</p><span class="btn off">${L}</span></div>`).join("");
 if(s.type==="check"){
  let k=0;
  const g=s.groups.map((gr,gi)=>`<div class="paper"><h3>${gr[0]}</h3>${gr[1].map((x,i)=>{const id=s.key+gi+"_"+i,[t,d]=x.split("::");return`<label class="chk"><input type="checkbox" data-id="${id}" ${S.ck[id]?"checked":""}><span>${t}${d?`<small class="ds">${d}</small>`:""}</span></label>`}).join("")}</div>`).join("");
  return `<div class="prog"><div style="display:flex;justify-content:space-between"><span>میزان تکمیل</span><span class="pct" id="pc">${pct(s)}٪</span></div><div class="bar"><i id="pb" style="width:${pct(s)}%"></i></div></div>${g}<div id="fin" class="msg" style="display:${pct(s)==100?"block":"none"}">${s.done}</div><button class="btn g" id="rst">بازنشانی چک‌لیست</button>`;
 }
}
function page(s){
 const i=SECTIONS.indexOf(s),nx=SECTIONS[i+1];
 return `<div class="pg"><button class="back" onclick="location.hash=''">${svg("back").replace("<svg","<svg style='transform:scaleX(-1);width:18px'")}بازگشت به خانه</button><h2>${s.t}</h2><p class="lead">${s.lead||s.d}</p>${body(s)}<div class="foot"><button class="btn g" onclick="location.hash=''">خانه</button>${nx?`<button class="btn" onclick="location.hash='${nx.id}'">بخش بعدی: ${nx.t}</button>`:""}</div></div>`;
}
function bindCheck(s){
 document.querySelectorAll(".chk input").forEach(el=>el.onchange=()=>{
  S.ck[el.dataset.id]=el.checked;save();const p=pct(s);
  $("#pc").textContent=p+"٪";$("#pb").style.width=p+"%";$("#fin").style.display=p==100?"block":"none";
  if(p==100)toast(s.done);else if(el.checked&&Math.random()<.2)toast(MSG[Math.floor(Math.random()*MSG.length)]);
 });
 $("#rst").onclick=()=>{if(!confirm("چک‌لیست بازنشانی شود؟"))return;items(s).forEach(o=>delete S.ck[o.id]);save();render()};
}
const norm=s=>String(s).replace(/ي/g,"ی").replace(/ك/g,"ک").replace(/[\u200c\u064b-\u065f]/g,"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).toLowerCase();
const flat=(o,a=[])=>{if(typeof o==="string"){if(!/^(data:|https?:)/.test(o))a.push(o)}else if(o&&typeof o==="object")Object.values(o).forEach(v=>flat(v,a));return a};
let IDX=null;
function search(v){
 IDX=IDX||SECTIONS.map(s=>({s,p:flat(s).map(t=>[t,norm(t)])}));
 const q=norm(v);let out="";
 IDX.forEach(({s,p})=>{
  const m=p.filter(x=>x[1].includes(q));if(!m.length)return;
  const sn=m.slice(0,2).map(([t,n])=>{const i=Math.max(0,n.indexOf(q)-30);const c=t.length>90?(i?"… ":"")+t.slice(i,i+90)+" …":t;return`<div class="ph">${esc(c)}</div>`}).join("");
  out+=`<button class="paper hit" onclick="location.hash='${s.id}'"><h3>${s.t}</h3>${sn}</button>`;
 });
 return out||'<p class="ph">چیزی پیدا نشد. عبارت دیگری را امتحان کن.</p>';
}
function render(){
 const h=location.hash.slice(1),s=SECTIONS.find(x=>x.id===h);
 $("#app").innerHTML=s?page(s):home();
 if(s){S.visited[s.id]=1;save();if(s.type==="check")bindCheck(s)}
 else{const q=$("#q");q.oninput=()=>{const v=q.value.trim(),g=$("#grid");g.className=v?"":"grid";g.innerHTML=v?search(v):SECTIONS.map(tile).join("")}}
 window.scrollTo(0,0);
}
$("#go").onclick=()=>{$("#splash").classList.add("out");$("#app").classList.add("on");setTimeout(()=>$("#splash").remove(),800);render()};
window.addEventListener("hashchange",()=>{if($("#app").classList.contains("on"))render()});
</script>
</body>
</html>
